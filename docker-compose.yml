services:
  fe:
    build:
      context: ./fe
    image: ghcr.io/syamsulhudauul/uul_chat_ai-fe:latest
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_API_BASE_URL=${API_BASE_URL}

  be:
    build:
      context: ./be
    image: ghcr.io/syamsulhudauul/uul_chat_ai-be:latest
    restart: unless-stopped
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}

  # Single ingress point (fe/be aren't published directly — reached only
  # through here). CADDYFILE picks the config:
  #   - Caddyfile.ip  : no domain yet, plain :80, path-based /api routing
  #                     (default — matches most cloud security groups'
  #                     default-open port)
  #   - Caddyfile     : real domain, automatic HTTPS
  # Swap by changing CADDYFILE in .env (and DOMAIN once you have one).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./${CADDYFILE:-Caddyfile.ip}:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fe
      - be

volumes:
  caddy_data:
  caddy_config:
