model_list:
  - model_name: cheap
    litellm_params:
      model: openrouter/google/gemini-2.5-flash
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: strong
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.5
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: embeddings
    litellm_params:
      model: voyage/voyage-3
      api_key: os.environ/VOYAGE_API_KEY

  # No separate STT entry: confirmed live that LiteLLM's /audio/transcriptions
  # doesn't support gemini ("Unmapped provider passed in"). Transcription
  # instead goes through the "cheap" chat model above with multimodal
  # audio input (see gateway.py transcribe()), which works.

  # Confirmed live: this already returns a properly headered WAV file,
  # not raw PCM.
  - model_name: tts
    litellm_params:
      model: gemini/gemini-2.5-flash-preview-tts
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
